{{ define "body_class" }}page page-aboutus{{ end }}

{{ define "main" }}
<div class="page-banner{{ with .Params.intro_image }} page-banner--photo{{ end }}">
  {{ partial "paw-trail.html" . }}
  <div class="container">
    <div class="page-banner-content">
      <h1>{{ .Title }}</h1>
      {{ with .Params.description }}<p class="page-banner-lead">{{ . }}</p>{{ end }}
    </div>
    {{ with .Params.intro_image }}
    <div class="page-banner-photo">
      <img src="{{ . | relURL }}" alt="{{ $.Title }}">
    </div>
    {{ end }}
  </div>
</div>
<div class="page-aboutus">
  <div class="container">
    <div class="content">
      {{ .Content }}
    </div>
  </div>
</div>
{{ end }}
