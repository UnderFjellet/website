baseURL = "https://underfjellet.no/"
languageCode = "no"
title = "Dyrlegen Under Fjellet"
theme = "underfjellet"

[params.logo]
mobile = "images/du_logo.png"
mobile_height = "36px"
desktop = "images/du_logo.png"
desktop_height = "100px"
alt = "Dyrlegen Underfjellet"

[params.homepage]
show_contact_box = true # show / hide the contaxt box on the homepage
show_services_button = true  # show / hide the "view all services" button

[params.notice]
# Site-wide announcement banner, shown above the header.
# Set show=false to hide it. Bump `id` when the message changes
# so visitors who dismissed the previous banner see the new one.
show     = true
id       = "moved-2026"
text     = 'Vi har flyttet! Du finner oss nå i <strong>Sykehusveien 14, 3080 Holmestrand</strong>.'
cta_text = "Se kart"
cta_url  = "https://www.google.com/maps/search/?api=1&query=Sykehusveien+14%2C+3080+Holmestrand"

[menu]
  # Main Menu
  [[menu.main]]
      name = "Hjem"
      url = "/"
      weight = 1

  [[menu.main]]
      name = "Tjenester"
      url = "/tjenester/"
      weight = 2

  [[menu.main]]
      name = "Priser"
      url = "/priser/"
      weight = 3

  [[menu.main]]
      name = "Spørsmål og svar"
      url = "/faq/"
      weight = 4

  [[menu.main]]
      name = "Om oss"
      url = "/omoss/"
      weight = 5

[params.footer]
copyright_text = '&#169; 2021-2026 Dyrlegen Under Fjellet'

[params.fonts]
# sets the google font link in layouts/partials/google-fonts.html
google_fonts = 'https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:wght@400;600&display=swap'
heading = "Comfortaa"
base = "Nunito"

[params.colors]
primary = "#5ba5c5"
black = "#2a2d24"
white = "#ffffff"
white_offset = "#f7f6f2"
grey = "#6b6966"

[params.seo]
meta_og_image = "images/du_logo.png"

