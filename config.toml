[params.fonts]
# sets the google font link in layouts/partials/google-fonts.html
google_fonts = 'https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:wght@400;600&display=swap'
heading = "Comfortaa"
base = "Nunito"

[params.colors]
primary = "#5ba5c5"
black = "#2a2d24"
white = "#ffffff"
